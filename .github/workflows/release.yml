name: Release

on:
  workflow_run:
    workflows: ["Ruff, Test"]
    types:
      - completed
    branches: [master]

jobs:
  release:
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      tag: ${{ steps.semrel.outputs.tag }}
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/master' }}

    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # A release made with GITHUB_TOKEN does not trigger other workflows, so the
  # PyPI publish is called from here instead of on `release: published`.
  publish:
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
